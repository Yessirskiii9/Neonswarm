 if(a==='inv'&&TG)TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(BOT_LINK)+'&text='+encodeURIComponent('Заходи в Neon Swarm 3D: выживай, качайся, ломай базы!'));
 if(a==='dif'){S.dif=i;save();ui('menu')}

 if(a==='daily'){const d=Math.floor(Date.now()/864e5);S.streak=S.day===d-1?S.streak+1:1;S.day=d;S.coins+=100*Math.min(7,S.streak);lw=100*Math.min(7,S.streak);save();ui('menu')}
